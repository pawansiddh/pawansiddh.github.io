function save(){localStorage.setItem('pavenro.finance.v3',JSON.stringify(state))}function notify(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function totalBalance(){return state.accounts.reduce((s,a)=>s+a.balance,0)}function monthIncome(){return state.transactions.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0)}function monthSpend(){return state.transactions.filter(t=>t.amount<0&&t.cat!=='Transfer').reduce((s,t)=>s-Math.min(0,t.amount),0)}function billsDue(){return state.bills.filter(b=>b.status!=='Paid').reduce((s,b)=>s+b.amount,0)}function totalGoalSaved(){return state.goals.reduce((s,g)=>s+g.saved,0)}function totalGoalTarget(){return state.goals.reduce((s,g)=>s+g.target,0)}function safeToSpend(){const reserve=state.budgets.reduce((s,b)=>s+Math.max(0,b.budget-b.spent),0);return Math.max(0,totalBalance()-billsDue()-reserve)}
function stat(label,value,foot,ico='•',tone=''){return `<div class="stat"><div class="stat-top"><span class="stat-icon">${ico}</span><span>${label}</span></div><div class="stat-value ${tone}">${value}</div><div class="stat-foot">${foot}</div></div>`}

function taxPage(){let r=state.taxRecords.find(x=>x.id===selected)||state.taxRecords[0];return `<div class="page">${head('Tax Records','Organize filing years, deduction proofs and deadlines','<button class="btn primary" data-action="tax">＋ Add Record</button>')}<div class="stats four">${stat('Current Filing', 'FY 2026–27','Active year','▧')}${stat('Documents Ready',state.taxRecords.reduce((s,x)=>s+x.docs,0),'Linked proofs','□')}${stat('Next Deadline','15 Sep','Advance tax','◷','warn')}${stat('Tracked Deductions',money(178800),'80C + 80D','✓','good')}</div><div class="split"><section class="card"><div class="card-head"><h3>Tax Organizer</h3></div><div class="card-body table-wrap"><table><thead><tr><th>Year</th><th>Record</th><th>Status</th><th>Deadline</th><th>Amount</th><th>Docs</th></tr></thead><tbody>${state.taxRecords.map(x=>`<tr class="selectable ${x.id===r.id?'selected':''}" data-select="tax:${x.id}"><td><b>${x.year}</b></td><td>${x.type}</td><td><span class="tag ${x.status==='Filed'||x.status==='Ready'?'green':'orange'}">${x.status}</span></td><td>${fmtDate(x.deadline)}</td><td>${money(x.amount)}</td><td>${x.docs}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><div class="detail"><h3>${r.type}</h3><span class="tag ${r.status==='Filed'||r.status==='Ready'?'green':'orange'}">${r.status}</span><div class="detail-grid"><div><span>Financial Year</span><b>${r.year}</b></div><div><span>Deadline</span><b>${fmtDate(r.deadline)}</b></div><div><span>Tracked amount</span><b>${money(r.amount)}</b></div><div><span>Documents</span><b>${r.docs}</b></div></div><h4>Linked Documents</h4>${state.documents.filter(d=>d.cat==='Tax Documents'||d.cat==='Salary Slips').slice(0,4).map(d=>`<div class="mini-row"><span>${d.name}</span><span class="tag green">Ready</span></div>`).join('')}<p class="muted">PAVENRO organizes your records; it does not calculate or file official taxes on your behalf.</p></div></section></div></div>`}
function paydaysPage(){let p=state.paydays.find(x=>x.id===selected)||state.paydays[0];return `<div class="page">${head('Paydays','See expected income dates from your income rules','<button class="btn primary" data-action="income-source">＋ Add Income Rule</button>')}<div class="stats four">${stat('Next Payday',fmtDate(state.paydays[0].date).replace(', 2026',''),'SBI interest','◷')}${stat('Expected Next 30 Days',money(state.paydays.reduce((s,x)=>s+x.amount,0)),'Across '+state.paydays.length+' events','↗')}${stat('Scheduled Sources',state.paydays.length,'Income events','▦')}${stat('Received This Month',money(state.incomes.reduce((s,x)=>s+x.received,0)),'Recorded','✓','good')}</div><div class="split"><section class="card"><div class="card-head"><h3>Payday Timeline</h3><span class="sub">Aug–Sep 2026</span></div><div class="card-body scroll">${state.paydays.map(x=>`<div class="note-card ${x.id===p.id?'selected':''}" data-select="payday:${x.id}" style="margin-bottom:8px"><div style="display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center"><div><b>${fmtDate(x.date).replace(', 2026','')}</b></div><div><b>${x.source}</b><small class="muted" style="display:block">${x.status}</small></div><div class="money">${money(x.amount)}</div></div></div>`).join('')}</div></section><section class="card"><div class="detail"><h3>${p.source}</h3><div class="detail-amount">${money(p.amount)}</div><div class="detail-grid"><div><span>Date</span><b>${fmtDate(p.date)}</b></div><div><span>Status</span><b>${p.status}</b></div><div><span>Generated from</span><b>Income rule</b></div><div><span>Action</span><b>Confirm when received</b></div></div><button class="btn primary">Open Income Source</button></div></section></div></div>`}
function settingsPage(){const tabs=[['profile','⚑','Profile & account'],['navigation','☷','Navigation & modules'],['appearance','◐','Appearance'],['notifications','◇','Notifications'],['briefing','✹','Daily briefing popup'],['accessibility','◖','Voice & accessibility'],['workspaces','▦','Workspaces'],['groups','◎','Groups & privacy'],['messaging','✉','Messaging & privacy'],['import','⇄','Import / export'],['security','◇','Security & danger zone']];return `<div class="page">${head('User & app settings','Your complete account and application control center')}<div class="settings-shell"><section class="card"><div class="settings-menu">${tabs.map(t=>`<button class="${settingsTab===t[0]?'active':''}" data-setting-tab="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('')}</div></section><section class="card"><div class="settings-pane">${settingsPane()}</div></section></div></div>`}

if(settingsTab==='appearance')return `<h3>Appearance</h3><p class="muted">Choose a PAVENRO theme. The logo adapts so it looks integrated with the interface.</p><div class="theme-grid"><div class="theme-card sage ${state.settings.theme==='sage'?'selected':''}" data-theme="sage">Sage Finance</div><div class="theme-card midnight ${state.settings.theme==='midnight'?'selected':''}" data-theme="midnight">PAVENRO Midnight</div><div class="theme-card classic ${state.settings.theme==='classic'?'selected':''}" data-theme="classic">Classic Focus</div><div class="theme-card auto" data-theme="sage">Automatic</div></div><div class="setting-row"><div><b>Interface density</b><small>Comfortable spacing for this demo</small></div><select class="btn"><option>Comfortable</option><option>Compact</option></select></div><div class="setting-row"><div><b>Text style</b><small>Matches Focus editorial headings</small></div><select class="btn"><option>Editorial — Georgia</option><option>Modern — Inter</option></select></div>`;
if(settingsTab==='profile')return `<h3>Profile & account</h3><p class="muted">Account details used across PAVENRO Focus.</p><div class="setting-row"><div><b>Profile photo</b><small>Shown in the top-right avatar</small></div><span class="profile-avatar">PK</span></div><div class="form-grid" style="max-width:680px;margin-top:12px"><div class="field"><label>Display name</label><input value="Pawan Kumar"></div><div class="field"><label>Email</label><input value="pawan@example.com"></div><div class="field"><label>Default currency</label><select><option>INR · Indian Rupee</option><option>USD · US Dollar</option></select></div><div class="field"><label>Region</label><select><option>India</option></select></div></div><div class="setting-row"><div><b>Change password</b><small>Account security</small></div><button class="btn">Update password</button></div>`;
if(settingsTab==='notifications')return `<h3>Notifications</h3><p class="muted">Choose which finance events appear in your notification center.</p>${[['Bill reminders','Due, overdue and upcoming bills'],['Budget alerts','75%, 90% and over-limit warnings'],['Income reminders','Expected paydays and pending payments'],['Goal milestones','Savings progress milestones'],['Document expiry','Expiry and renewal reminders']].map((x,i)=>`<div class="setting-row"><div><b>${x[0]}</b><small>${x[1]}</small></div><div class="toggle on"><i></i></div></div>`).join('')}`;
if(settingsTab==='briefing')return `<h3>Daily briefing popup</h3><p class="muted">A compact summary when you open Finance.</p><div class="setting-row"><div><b>Show finance briefing</b><small>Upcoming bills, budget alerts, paydays and goals</small></div><div class="toggle ${state.settings.dailyBrief?'on':''}" data-setting-toggle="dailyBrief"><i></i></div></div><div class="card" style="padding:14px;background:var(--panel2);margin-top:12px"><b>Good morning, Pawan</b><p class="muted">Rent due in 3 days · Food budget at 82% · Salary expected 1 Sep · Emergency fund at 62%</p></div>`;
if(settingsTab==='accessibility')return `<h3>Voice & accessibility</h3><div class="setting-row"><div><b>Voice summaries</b><small>Read key dashboard summaries aloud</small></div><div class="toggle ${state.settings.voice?'on':''}" data-setting-toggle="voice"><i></i></div></div><div class="setting-row"><div><b>Reduced motion</b><small>Limit animated transitions</small></div><div class="toggle"><i></i></div></div><div class="setting-row"><div><b>High contrast</b><small>Increase border and text contrast</small></div><div class="toggle"><i></i></div></div>`;
if(settingsTab==='workspaces')return `<h3>Workspaces</h3><p class="muted">Finance is the active category preset inside your Focus workspace.</p><div class="note-card"><b>Personal Focus</b><p class="muted">Finance preset · 8 default modules · local demo data</p><span class="tag green">Active</span></div><button class="btn" style="margin-top:12px">＋ Create workspace</button>`;
if(settingsTab==='groups')return `<h3>Groups & privacy</h3><p class="muted">Groups can be hidden from the sidebar. Focus remains owned by one user.</p><div class="setting-row"><div><b>Show Groups</b><small>Optional Focus connection area</small></div><div class="toggle ${state.settings.modules.Groups?'on':''}" data-toggle-module="Groups"><i></i></div></div><div class="setting-row"><div><b>Finance data sharing</b><small>Off by default in Focus</small></div><span class="tag green">Private</span></div>`;
if(settingsTab==='messaging')return `<h3>Messaging & privacy</h3><p class="muted">Message controls apply only when Groups are enabled.</p><div class="setting-row"><div><b>Group messages</b><small>Allow messages from joined groups</small></div><div class="toggle on"><i></i></div></div><div class="setting-row"><div><b>Finance record sharing</b><small>Never automatically share Finance records</small></div><span class="tag green">Protected</span></div>`;
if(settingsTab==='import')return `<h3>Import / export</h3><p class="muted">Move finance data without requiring a bank connection.</p><div class="setting-row"><div><b>Import transactions CSV</b><small>Map bank-exported CSV columns manually</small></div><button class="btn">Import CSV</button></div><div class="setting-row"><div><b>Export finance backup</b><small>Accounts, transactions, bills, budgets, income, goals and settings</small></div><button class="btn" data-export>Export JSON</button></div><div class="setting-row"><div><b>Restore backup</b><small>Restore a previously exported PAVENRO backup</small></div><button class="btn">Choose File</button></div>`;
if(settingsTab==='security')return `<h3>Security & danger zone</h3><p class="muted">Finance demo is manual-first and does not request online banking credentials.</p><div class="setting-row"><div><b>Local demo storage</b><small>Data persists in this browser using localStorage</small></div><span class="tag green">Enabled</span></div><div class="setting-row"><div><b>Reset Finance demo</b><small>Remove edits and restore all seeded records</small></div><button class="btn danger" data-reset>Reset demo</button></div>`;return '<h3>Settings</h3>'}
function groupsPage(){return `<div class="page">${head('Groups','Optional Focus connection area')}<div class="split"><section class="card"><div class="card-head"><h3>Your Groups</h3></div><div class="card-body"><div class="note-card"><b>Personal Study Circle</b><p class="muted">3 members · No Finance records shared</p><span class="tag green">Connected</span></div><div class="note-card" style="margin-top:8px"><b>Family Planning</b><p class="muted">2 members · Finance sharing disabled in Focus</p><span class="tag">Private</span></div></div></section><section class="card"><div class="detail"><h3>Focus ownership</h3><p class="muted">PAVENRO Focus has one owner. Groups may collaborate on enabled shared areas, but your Finance preset remains private unless a future sharing feature is explicitly enabled.</p></div></section></div></div>`}
function helpPage(){return `<div class="page">${head('Help & Support','Understand what every Finance section does')}<div class="split"><section class="card"><div class="card-head"><h3>Finance Guide</h3></div><div class="card-body scroll">${core.concat(optional).map(n=>`<div class="mini-row"><div><b>${n}</b><small>${HELP[n]?.[0]||''}</small></div><button class="btn soft" data-help="${n}">?</button></div>`).join('')}</div></section><section class="card"><div class="detail"><h3>Manual-first data model</h3><p class="muted">Your source records come from manual entry, recurring rules and optional file/CSV import. Dashboards and graphs are calculated automatically from those records. Direct bank sync is not required for PAVENRO Finance to work.</p><div class="mini-row"><span>Offline editing</span><span class="tag green">Works</span></div><div class="mini-row"><span>Cloud sync</span><span class="tag">Optional architecture</span></div><div class="mini-row"><span>Bank credentials</span><span class="tag green">Not required</span></div><div class="mini-row"><span>OCR extraction</span><span class="tag">Future optional</span></div></div></section></div></div>`}
function simplePage(v){return `<div class="page">${head(v,'Optional Finance section')}<section class="card" style="flex:1"><div class="card-body"><h3>${v}</h3><p class="muted">This section is enabled but has no configured component yet.</p></div></section></div>`}
function bindPage(){$$('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));$$('[data-select]').forEach(el=>el.onclick=()=>{const [type,id]=el.dataset.select.split(':');selected=id;render()});$$('[data-action]').forEach(b=>b.onclick=()=>openAction(b.dataset.action));$$('[data-help]').forEach(b=>b.onclick=()=>openHelp(b.dataset.help));$$('[data-mark-paid]').forEach(b=>b.onclick=()=>markPaid(b.dataset.markPaid));$$('[data-mark-income]').forEach(b=>b.onclick=()=>markIncome(b.dataset.markIncome));$$('[data-contribute]').forEach(b=>b.onclick=()=>contribute(b.dataset.contribute));$$('[data-setting-tab]').forEach(b=>b.onclick=()=>{settingsTab=b.dataset.settingTab;render()});$$('[data-toggle-module]').forEach(t=>t.onclick=()=>{let n=t.dataset.toggleModule;state.settings.modules[n]=!state.settings.modules[n];save();render()});$$('[data-theme]').forEach(t=>t.onclick=()=>{state.settings.theme=t.dataset.theme;save();render()});$$('[data-setting-toggle]').forEach(t=>t.onclick=()=>{let n=t.dataset.settingToggle;state.settings[n]=!state.settings[n];save();render()});$$('[data-reset]').forEach(b=>b.onclick=()=>{localStorage.removeItem('pavenro.finance.v3');state=structuredClone(seed);view='Dashboard';selected=null;save();render();notify('Finance demo restored')});$$('[data-export]').forEach(b=>b.onclick=exportData)}
function openHelp(name){const h=HELP[name]||['About this section','No guide available.'];openModal(`<div class="modal-head"><h3>${name} · Help</h3><button class="close-x" data-close>×</button></div><div class="modal-body"><div class="eyebrow">${h[0]}</div><p style="line-height:1.6">${h[1]}</p><h4>How data works</h4><p class="muted">Manual records are the source of truth. PAVENRO calculates summaries, progress, totals and alerts automatically from those records. External bank data is not silently fetched in this demo.</p></div><div class="modal-foot"><button class="btn primary" data-close>Got it</button></div>`)}
function openModal(html){$('#modal').innerHTML=html;$('#modalBg').classList.remove('hidden');$$('[data-close]').forEach(b=>b.onclick=closeModal)}function closeModal(){$('#modalBg').classList.add('hidden')}
function openAction(a){if(a==='expense'||a==='edit-transaction')return txModal(a==='edit-transaction');if(a==='account'||a==='edit-account')return accountModal();if(a==='transfer')return transferModal();if(a==='bill')return billModal();if(a==='income'||a==='income-source')return incomeModal();if(a==='goal')return goalModal();if(a==='document')return documentModal();if(a==='subscription')return subscriptionModal();if(a==='budget'||a==='edit-budget')return budgetModal();if(a==='note')return noteModal();if(a==='debt'||a==='debt-payment'||a==='investment'||a==='tax')return genericModal(a);notify('Demo action opened')}
function formWrap(title,body,saveLabel='Save',onSave='') {openModal(`<div class="modal-head"><h3>${title}</h3><button class="close-x" data-close>×</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="modalSave">${saveLabel}</button></div>`);$('#modalSave').onclick=onSave}
function txModal(edit=false){let t=edit?(state.transactions.find(x=>x.id===selected)||state.transactions[0]):null;formWrap(edit?'Edit Transaction':'Add Transaction',`<div class="form-grid"><div class="field full"><label>Description</label><input id="fName" value="${t?.name||''}" placeholder="e.g. Grocery Store"></div><div class="field"><label>Amount</label><input id="fAmount" type="number" value="${t?Math.abs(t.amount):''}" placeholder="1250"></div><div class="field"><label>Type</label><select id="fType"><option ${t?.amount<0?'selected':''}>Expense</option><option ${t?.amount>0?'selected':''}>Income</option></select></div><div class="field"><label>Category</label><select id="fCat">${['Food & Dining','Transport','Shopping','Utilities','Entertainment','Health','Income','Other'].map(x=>`<option ${t?.cat===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Account</label><select id="fAccount">${state.accounts.map(a=>`<option value="${a.id}" ${t?.account===a.id?'selected':''}>${a.name}</option>`).join('')}</select></div><div class="field full"><label>Notes</label><textarea id="fNote">${t?.note||''}</textarea></div></div>`,'Save',()=>{let amount=Math.abs(Number($('#fAmount').value)||0);if($('#fType').value==='Expense')amount=-amount;if(t){const old=account(t.account);if(old)old.balance-=t.amount;Object.assign(t,{name:$('#fName').value||'Transaction',amount,cat:$('#fCat').value,account:$('#fAccount').value,note:$('#fNote').value});}else{t={id:'t'+Date.now(),date:'2026-08-27',name:$('#fName').value||'Transaction',cat:$('#fCat').value,account:$('#fAccount').value,method:'Manual',tag:'Manual',status:'Cleared',amount,note:$('#fNote').value};state.transactions.unshift(t)}account(t.account).balance+=amount;save();closeModal();selected=t.id;go('Transactions');notify('Transaction saved')})}
function accountModal(){formWrap('Add Account',`<div class="form-grid"><div class="field full"><label>Account Name</label><input id="aName" placeholder="e.g. ICICI Savings"></div><div class="field"><label>Type</label><select id="aType"><option>Bank Account</option><option>Savings Account</option><option>Wallet</option><option>Credit Card</option></select></div><div class="field"><label>Opening Balance</label><input id="aBal" type="number" value="0"></div><div class="field"><label>Institution</label><input id="aInst" placeholder="Bank or provider"></div><div class="field"><label>Last 4 digits</label><input id="aMask" maxlength="4" placeholder="1234"></div></div>`,'Add Account',()=>{state.accounts.push({id:'a'+Date.now(),name:$('#aName').value||'New Account',type:$('#aType').value,balance:Number($('#aBal').value)||0,in:0,out:0,last:'New account',masked:'•••• '+($('#aMask').value||'0000'),institution:$('#aInst').value||'Manual',currency:'INR'});save();closeModal();go('Accounts');notify('Account added')})}
function transferModal(){formWrap('Transfer Money',`<div class="form-grid"><div class="field"><label>From</label><select id="trFrom">${state.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div><div class="field"><label>To</label><select id="trTo">${state.accounts.map((a,i)=>`<option value="${a.id}" ${i===1?'selected':''}>${a.name}</option>`).join('')}</select></div><div class="field full"><label>Amount</label><input id="trAmount" type="number" value="1000"></div></div>`,'Transfer',()=>{const from=account($('#trFrom').value),to=account($('#trTo').value),amt=Math.abs(Number($('#trAmount').value)||0);if(!from||!to||from===to||!amt)return notify('Choose two accounts and an amount');from.balance-=amt;to.balance+=amt;state.transactions.unshift({id:'t'+Date.now(),date:'2026-08-27',name:`Transfer to ${to.name}`,cat:'Transfer',account:from.id,method:'Internal Transfer',tag:'Transfer',status:'Cleared',amount:-amt,note:''});save();closeModal();go('Accounts');notify('Transfer recorded')})}
function billModal(){formWrap('Add Bill',`<div class="form-grid"><div class="field full"><label>Bill Name</label><input id="bName" placeholder="e.g. Electricity"></div><div class="field"><label>Amount</label><input id="bAmt" type="number" value="1000"></div><div class="field"><label>Due Date</label><input id="bDue" type="date" value="2026-09-15"></div><div class="field"><label>Category</label><input id="bCat" value="Utilities"></div><div class="field"><label>Account</label><select id="bAcc">${state.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div></div>`,'Add Bill',()=>{state.bills.push({id:'b'+Date.now(),name:$('#bName').value||'New Bill',amount:Number($('#bAmt').value)||0,due:$('#bDue').value,freq:'Monthly',cat:$('#bCat').value||'Other',account:$('#bAcc').value,status:'Upcoming',autopay:false,reminder:'2 days before'});save();closeModal();go('Bills');notify('Bill added')})}
function incomeModal(){formWrap('Add Income Source',`<div class="form-grid"><div class="field"><label>Source</label><input id="iSource" placeholder="Salary"></div><div class="field"><label>From</label><input id="iFrom" placeholder="Company or client"></div><div class="field"><label>Expected Amount</label><input id="iAmt" type="number" value="10000"></div><div class="field"><label>Next Payday</label><input id="iNext" type="date" value="2026-09-15"></div><div class="field full"><label>Account</label><select id="iAcc">${state.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div></div>`,'Add Source',()=>{state.incomes.push({id:'i'+Date.now(),source:$('#iSource').value||'Income',from:$('#iFrom').value||'Source',expected:Number($('#iAmt').value)||0,received:0,freq:'One-time',next:$('#iNext').value,account:$('#iAcc').value,status:'Pending'});save();closeModal();go('Income');notify('Income source added')})}
function goalModal(){formWrap('Add Savings Goal',`<div class="form-grid"><div class="field full"><label>Goal Name</label><input id="gName" placeholder="New Goal"></div><div class="field"><label>Target Amount</label><input id="gTarget" type="number" value="50000"></div><div class="field"><label>Already Saved</label><input id="gSaved" type="number" value="0"></div><div class="field"><label>Target Date</label><input id="gDate" type="date" value="2027-01-31"></div><div class="field"><label>Monthly Contribution</label><input id="gMonthly" type="number" value="5000"></div></div>`,'Add Goal',()=>{state.goals.push({id:'g'+Date.now(),name:$('#gName').value||'Goal',target:Number($('#gTarget').value)||0,saved:Number($('#gSaved').value)||0,date:$('#gDate').value,monthly:Number($('#gMonthly').value)||0,status:'On Track',account:'a2'});save();closeModal();go('Funds & Goals');notify('Goal added')})}
function documentModal(){formWrap('Upload Document Metadata',`<div class="form-grid"><div class="field full"><label>Document Name</label><input id="dName" placeholder="Statement or receipt name"></div><div class="field"><label>Category</label><select id="dCat"><option>Bank Statements</option><option>Receipts</option><option>Insurance</option><option>Tax Documents</option><option>Salary Slips</option><option>Invoices</option><option>Loan Docs</option><option>Investments</option></select></div><div class="field"><label>Linked To</label><input id="dLink" placeholder="Account, bill or transaction"></div><div class="field full"><label>Choose File (demo)</label><input type="file"></div></div>`,'Save Document',()=>{state.documents.unshift({id:'d'+Date.now(),name:$('#dName').value||'New Document',cat:$('#dCat').value,linked:$('#dLink').value||'General',date:'2026-08-27',expiry:'—',type:'PDF',status:'Active'});save();closeModal();go('Documents');notify('Document record saved')})}
function subscriptionModal(){formWrap('Add Subscription',`<div class="form-grid"><div class="field full"><label>Service</label><input id="sName" placeholder="Service name"></div><div class="field"><label>Amount</label><input id="sAmt" type="number" value="499"></div><div class="field"><label>Next Renewal</label><input id="sNext" type="date" value="2026-09-20"></div><div class="field"><label>Category</label><input id="sCat" value="Entertainment"></div><div class="field"><label>Account</label><select id="sAcc">${state.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div></div>`,'Add Subscription',()=>{state.subscriptions.push({id:'s'+Date.now(),name:$('#sName').value||'Subscription',cat:$('#sCat').value,amount:Number($('#sAmt').value)||0,freq:'Monthly',next:$('#sNext').value,account:$('#sAcc').value,status:'Active',used:'Regularly'});save();closeModal();go('Subscriptions');notify('Subscription added')})}
function budgetModal(){let b=state.budgets.find(x=>x.cat===selected)||state.budgets[0];formWrap('Edit Budget Limit',`<div class="field"><label>${b.cat} monthly budget</label><input id="budgetLimit" type="number" value="${b.budget}"></div>`,'Save Limit',()=>{b.budget=Number($('#budgetLimit').value)||b.budget;save();closeModal();go('Budget',b.cat);notify('Budget updated')})}
function noteModal(){formWrap('New Finance Note',`<div class="form-grid"><div class="field full"><label>Title</label><input id="nTitle" placeholder="Note title"></div><div class="field"><label>Link to</label><select id="nLink">${core.concat(optional).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field full"><label>Note</label><textarea id="nText"></textarea></div></div>`,'Save Note',()=>{state.notes.unshift({id:'n'+Date.now(),title:$('#nTitle').value||'New Note',link:$('#nLink').value,text:$('#nText').value,date:'2026-08-27',pin:false});save();closeModal();go('Notes');notify('Note saved')})}
function genericModal(type){formWrap(type.replace('-',' '),`<p class="muted">This demo action is available so you can test the interaction pattern. Enter an amount or note below.</p><div class="field"><label>Amount / value</label><input id="genericValue" type="number" value="1000"></div><div class="field"><label>Note</label><textarea></textarea></div>`,'Save',()=>{closeModal();notify('Demo record saved')})}
function markPaid(id){let b=state.bills.find(x=>x.id===id);if(!b||b.status==='Paid')return;b.status='Paid';const a=account(b.account);if(a){a.balance-=b.amount;a.out+=b.amount}state.transactions.unshift({id:'t'+Date.now(),date:'2026-08-27',name:b.name,cat:b.cat,account:b.account,method:'Bill Payment',tag:'Bill',status:'Cleared',amount:-b.amount,note:'Created from Bill payment'});save();selected=id;render();notify('Bill marked paid and transaction created')}
function markIncome(id){let i=state.incomes.find(x=>x.id===id);if(!i||i.status==='Received')return;i.status='Received';i.received=i.expected;const a=account(i.account);if(a){a.balance+=i.expected;a.in+=i.expected}state.transactions.unshift({id:'t'+Date.now(),date:'2026-08-27',name:`${i.source} from ${i.from}`,cat:'Income',account:i.account,method:'Income Receipt',tag:'Income',status:'Cleared',amount:i.expected,note:'Created from Income source'});save();selected=id;render();notify('Income received and account updated')}
function contribute(id){let g=state.goals.find(x=>x.id===id);if(!g)return;formWrap('Add Contribution',`<div class="field"><label>Contribution to ${g.name}</label><input id="cAmt" type="number" value="${g.monthly}"></div>`,'Contribute',()=>{let amt=Math.abs(Number($('#cAmt').value)||0);g.saved=Math.min(g.target,g.saved+amt);const a=account(g.account);if(a)a.balance-=amt;state.transactions.unshift({id:'t'+Date.now(),date:'2026-08-27',name:`Contribution · ${g.name}`,cat:'Transfer',account:g.account,method:'Goal Transfer',tag:'Savings',status:'Cleared',amount:-amt,note:'Goal contribution'});save();closeModal();selected=id;go('Funds & Goals');notify('Goal contribution added')})}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='pavenro-finance-demo.json';a.click();URL.revokeObjectURL(u)}
function renderNotifications(){const pop=$('#notifPop');pop.innerHTML=`<div class="pop-head"><div><b>Notifications</b><small class="muted" style="display:block">${state.notifications.filter(n=>!n.read).length} unread</small></div><button class="btn soft" id="markAll">Mark all read</button></div><div class="pop-list">${state.notifications.map(n=>`<div class="notif" data-notif="${n.id}"><span class="notif-ico">${n.icon}</span><div><b>${n.title}</b><p>${n.text}</p><small class="muted">${n.time}</small></div></div>`).join('')}</div>`;$('#markAll').onclick=()=>{state.notifications.forEach(n=>n.read=true);save();pop.classList.add('hidden');render()};$$('[data-notif]').forEach(x=>x.onclick=()=>{let n=state.notifications.find(a=>a.id===x.dataset.notif);n.read=true;save();pop.classList.add('hidden');go(n.target)})}
function globalSearch(q){q=q.trim().toLowerCase();const pop=$('#searchPop');if(q.length<2){pop.classList.add('hidden');return}let results=[];state.accounts.forEach(x=>{if(x.name.toLowerCase().includes(q))results.push(['Accounts',x.id,x.name,x.type])});state.transactions.forEach(x=>{if((x.name+x.cat).toLowerCase().includes(q))results.push(['Transactions',x.id,x.name,x.cat])});state.bills.forEach(x=>{if((x.name+x.cat).toLowerCase().includes(q))results.push(['Bills',x.id,x.name,x.cat])});state.documents.forEach(x=>{if((x.name+x.cat).toLowerCase().includes(q))results.push(['Documents',x.id,x.name,x.cat])});state.goals.forEach(x=>{if(x.name.toLowerCase().includes(q))results.push(['Funds & Goals',x.id,x.name,'Goal'])});results=results.slice(0,8);pop.innerHTML=results.length?results.map((r,i)=>`<div class="search-result" data-search="${i}"><b>${r[2]}</b><small>${r[0]} · ${r[3]}</small></div>`).join(''):'<div class="search-result"><span class="muted">No matching finance records</span></div>';pop.classList.remove('hidden');$$('[data-search]').forEach(el=>el.onclick=()=>{let r=results[+el.dataset.search];pop.classList.add('hidden');$('#globalSearch').value='';go(r[0],r[1])})}
$('#moreSections').onclick=()=>{settingsTab='navigation';go('Settings')};$('#profileCard').onclick=()=>{settingsTab='profile';go('Settings')};$('#avatarBtn').onclick=()=>{settingsTab='profile';go('Settings')};$('#newTxTop').onclick=()=>openAction('expense');$('#bellBtn').onclick=e=>{e.stopPropagation();renderNotifications();$('#notifPop').classList.toggle('hidden')};$('#globalSearch').oninput=e=>globalSearch(e.target.value);$('#modalBg').onclick=e=>{if(e.target===$('#modalBg'))closeModal()};document.addEventListener('click',e=>{if(!$('#notifPop').contains(e.target)&&e.target!==$('#bellBtn'))$('#notifPop').classList.add('hidden');if(!$('.search-wrap').contains(e.target))$('#searchPop').classList.add('hidden')});
render();
</script>

  state.settings.currency=state.settings.currency||'INR';

  state.customCategories=state.customCategories||{expense:[],bill:[],income:[],subscription:[]};

  if(state.settings.modules.Calendar===undefined)state.settings.modules.Calendar=true;

  const css=document.createElement('style');css.textContent=`
    .dashboard-grid{grid-template-rows:178px minmax(138px,1fr) 112px!important}.dash-top{grid-template-columns:1.25fr .82fr 1.13fr!important}.dash-mid{grid-template-columns:.9fr 1fr 1fr!important}.donut{width:128px!important;height:128px!important}.donut:after{inset:30px!important}.distribution{grid-template-columns:145px minmax(0,1fr)!important}.accounts-bottom{grid-template-columns:1.05fr 1fr 1fr!important}.legend{min-width:0;gap:6px!important}.legend-row{grid-template-columns:9px minmax(0,1fr) auto!important}.legend-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.legend-row b{white-space:nowrap}.btn.pv-edit{height:25px;padding:0 7px;font-size:10px}.currency-select{min-width:78px;font-weight:800}.chart-legend-pv{display:flex;gap:13px;align-items:center;flex-wrap:wrap;font-size:9px;color:var(--muted);margin:0 0 4px}.chart-legend-pv i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.pv-cal-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(290px,.72fr);gap:10px;min-height:0;flex:1}.pv-calendar{display:grid;grid-template-rows:40px 28px minmax(0,1fr);min-height:0}.pv-week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:4px 9px;color:var(--muted);font-size:9px;font-weight:800;text-align:center}.pv-days{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,minmax(0,1fr));gap:5px;padding:8px;min-height:0;overflow:auto}.pv-day{border:1px solid var(--line);border-radius:8px;padding:5px;background:var(--panel);overflow:hidden}.pv-day.empty{opacity:.3}.pv-num{font-size:10px;font-weight:800;margin-bottom:4px}.pv-event{font-size:9px;padding:3px 4px;margin:2px 0;border-radius:5px;background:var(--brandSoft);color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.pv-cal-side{display:grid;grid-template-rows:minmax(0,1fr) 145px;gap:10px;min-height:0}@media(max-width:1180px){.dashboard-grid{grid-template-rows:154px minmax(130px,1fr) 106px!important}.dash-top{grid-template-columns:1.12fr .78fr 1fr!important}.dash-top>.card:last-child{display:block!important}.stats{height:136px!important}.stats.four{height:78px!important}}

  function calendarPagePV(){const ev=calendarEvents(),aug=ev.filter(e=>e.date.startsWith('2026-08-'));let start=new Date(2026,7,1).getDay(),cells='';for(let i=0;i<start;i++)cells+='<div class="pv-day empty"></div>';for(let d=1;d<=31;d++){const ds=`2026-08-${String(d).padStart(2,'0')}`,items=aug.filter(e=>e.date===ds);cells+=`<div class="pv-day"><div class="pv-num">${d}</div>${items.map(e=>`<div class="pv-event" data-pv-open="${e.target}" title="${e.type} · ${e.title}${e.amount?' · '+money(e.amount):''}">${e.type==='Bill'?'▤':e.type==='Income'?'↗':e.type==='Goal'?'◎':'□'} ${e.title}</div>`).join('')}</div>`}while((start+31)%7){cells+='<div class="pv-day empty"></div>';start++}const up=ev.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,12);return `<div class="page">${head('Calendar','Bills, paydays, savings reminders, document expiries and custom money events','<button class="btn primary" id="pvAddCal">＋ Add Finance Event</button>')}<div class="stats four">${stat('Finance Events',ev.length,'Across linked modules','▦')}${stat('Bill Dates',state.bills.filter(b=>b.status!=='Paid').length,'Due dates from Bills','▤')}${stat('Paydays',state.paydays.length,'Expected income dates','↗','good')}${stat('Goal Reminders',state.goals.length,'Savings reminders','◎')}</div><div class="pv-cal-layout"><section class="card pv-calendar"><div class="card-head"><h3>August 2026</h3><span class="sub">Finance month view</span></div><div class="pv-week">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<span>${x}</span>`).join('')}</div><div class="pv-days">${cells}</div></section><div class="pv-cal-side"><section class="card"><div class="card-head"><h3>Upcoming Finance Events</h3><span class="sub">Automatic + manual</span></div><div class="card-body scroll">${up.map(e=>`<div class="mini-row"><div><b>${e.title}</b><small>${fmtDate(e.date)} · ${e.type}</small></div><div style="text-align:right">${e.amount?`<b>${money(e.amount)}</b>`:''}<small><button class="btn pv-edit" data-pv-open="${e.   function patchGoalChart(){if(view!=='Funds & Goals')return;const cards=[...document.querySelectorAll('.card')],card=cards.find(c=>c.querySelector('.card-head h3')?.textContent.includes('Progress Over Time'));if(!card||card.querySelector('.chart-legend-pv'))return;const legend=document.createElement('div');legend.className='chart-legend-pv';legend.innerHTML='<span><i style="background:#57b87a"></i>Emergency Fund</span><span><i style="background:#8b67d8"></i>Vacation</span><span><i style="background:#e59b2f"></i>Insurance Renewal</span>';const body=card.querySelector('.card-body');body.prepend(legend);const svg=card.querySelector('svg');if(!svg)return;const pts=[[10,105,'Emergency Fund',42000,'#57b87a'],[120,88,'Emergency Fund',51000,'#57b87a'],[230,72,'Emergency Fund',61000,'#57b87a'],[340,58,'Emergency Fund',72000,'#57b87a'],[450,45,'Emergency Fund',84000,'#57b87a'],[590,31,'Emergency Fund',93000,'#57b87a'],[10,112,'Vacation',5000,'#8b67d8'],[120,103,'Vacation',8000,'#8b67d8'],[230,92,'Vacation',10000,'#8b67d8'],[340,77,'Vacation',13000,'#8b67d8'],[450,68,'Vacation',15000,'#8b67d8'],[590,60,'Vacation',18200,'#8b67d8'],[10,115,'Insurance Renewal',2000,'#e59b2f'],[120,108,'Insurance Renewal',3500,'#e59b2f'],[230,101,'Insurance Renewal',5000,'#e59b2f'],[340,89,'Insurance Renewal',6200,'#e59b2f'],[450,82,'Insurance Renewal',7000,'#e59b2f'],[590,73,'Insurance Renewal',8000,'#e59b2f']];pts.forEach(p=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r','4');c.setAttribute('fill',p[4]);const ti=document.createElementNS('http://www.w3.org/2000/svg','title');ti.textContent=`${p[2]} · ${fxFormat(p[3])}`;c.appendChild(ti);svg.appendChild(c)})}
  function patchSettings(){if(view!=='Settings')return;const menu=document.querySelector('.settings-menu');if(menu&&!menu.querySelector('[data-pv-language]')){const btn=document.createElement('button');btn.dataset.pvLanguage='1';btn.className=settingsTab==='language'?'active':'';btn.innerHTML='<span>文</span>Language & region';const appearance=[...menu.querySelectorAll('button')].find(x=>x.textContent.includes('Appearance'));appearance?.after(btn);btn.onclick=()=>{settingsTab='language';render()}}const ls=document.getElementById('pvLanguage');if(ls)ls.onchange=e=>{state.settings.language=e.target.value;save();render()};const cs=document.getElementById('pvCurrencySettings');if(cs)cs.onchange=e=>{state.settings.currency=e.target.value;save();fillCurrency();render()};if(settingsTab==='profile'){const label=[...document.querySelectorAll('.field label')].find(x=>x.textContent.includes('Default currency'));const sel=label?.parentElement?.querySelector('select');if(sel){sel.innerHTML=Object.keys(CURRENCIES).map(c=>`<option value="${c}" ${state.settings.currency===c?'selected':''}>${c} · ${CURRENCIES[c].name}</option>`).join('');sel.onchange=e=>{state.settings.currency=e.target.value;save();fillCurrency();render()}}}}
  function patchCalendarHandlers(){if(view!=='Calendar')return;document.querySelectorAll('[data-pv-open]').forEach(el=>el.onclick=()=>go(el.dataset.pvOpen));const add=document.getElementById('pvAddCal');if(add)add.onclick=()=>formWrap('Add Finance Calendar Event',`<div class="form-grid"><div class="field full"><label>Event name</label><input id="pvCEName" placeholder="Insurance renewal reminder"></div><div class="field"><label>Date</label><input id="pvCEDate" type="date" value="2026-09-15"></div><div class="field"><label>Type</label><select id="pvCEType"><option>Custom</option><option>Bill Reminder</option><option>Income / Payday</option><option>Goal Reminder</option><option>Document Expiry</option></select></div><div class="field"><label>Amount (optional)</label><input id="pvCEAmount" type="number" value="0"></div></div>`,'Save Event',()=>{state.notifications.unshift({id:'no'+Date.now(),icon:'▦',title:$('#pvCEName').value||'Finance event',text:fmtDate($('#pvCEDate').value)+(Number($('#pvCEAmount').value)?' · '+money(Number($('#pvCEAmount').value)):''),time:'Just now',read:false,target:'Calendar'});save();closeModal();notify('Finance calendar event saved');render()})}
  function patchGraphCards(){
    const findCard=title=>[...document.querySelectorAll('.card')].find(c=>c.querySelector('.card-head h3')?.textContent.trim()===title);
    [['Spending by Category',150],['Budget Allocation',150],['Account Distribution',150]].forEach(([title,w])=>{const c=findCard(title);if(!c)return;const body=c.querySelector('.card-body');if(body&&body.querySelector('.donut')){body.style.gridTemplateColumns=`${w}px minmax(0,1fr)`;body.style.gap='10px';body.style.alignItems='center';}const lg=c.querySelector('.legend');if(lg){lg.style.minWidth='0';lg.style.overflow='hidden';}});
  }
  function patchDOM(){if(brandSmall)brandSmall.textContent='FINANCE';if(navLabel)navLabel.textContent='PAVENRO FINANCE';fillCurrency();translateDOM();patchGraphCards();patchEdits();patchDetailEdit();patchGoalChart();patchSettings();patchCalendarHandlers();document.querySelectorAll('.legend-row').forEach(x=>x.title=x.textContent.replace(/\s+/g,' ').trim());convertMoneyDOM(document.getElementById('workspace'));convertMoneyDOM(document.getElementById('notifPop'));}

  const oldRenderNotifications=renderNotifications;
  renderNotifications=function(){oldRenderNotifications();setTimeout(()=>convertMoneyDOM(document.getElementById('notifPop')),0)};
  const oldRender=render;
  render=function(){oldRender();patchDOM()};
  const oldOpenModal=openModal;

  render();
})();

    function cleanDonuts(){
      document.querySelectorAll('.donut-center').forEach(center=>{
        if(center.querySelector('.pv-donut-inner')) return;
        const raw=center.textContent.replace(/\s+/g,' ').trim();
        let label='';
        ['Spent','Total','Budget','Net Worth','Portfolio'].forEach(x=>{if(raw.endsWith(x)) label=x});
        let value=label?raw.slice(0,-label.length).trim():raw;
        const wrap=document.createElement('div');wrap.className='pv-donut-inner';
        const strong=document.createElement('span');strong.className='pv-donut-value';strong.textContent=value;
        const small=document.createElement('span');small.className='pv-donut-label';small.textContent=label||'';
        const len=value.length; strong.style.fontSize=(len>15?'7.5px':len>12?'8.5px':len>9?'9.3px':'10.5px');
        wrap.append(strong,small);center.replaceChildren(wrap);
      });
      document.querySelectorAll('.distribution').forEach(x=>{x.style.gridTemplateColumns='148px minmax(0,1fr)';});
    }

    function dedupeEdits(){
      document.querySelectorAll('th.pv-edit-head').forEach(x=>x.remove());
      document.querySelectorAll('tbody tr').forEach(row=>{
        const edits=[...row.querySelectorAll('button')].filter(b=>/^\s*(Edit|संपादित|تعديل|编辑|Editar|Modifier|Bearbeiten|Изменить|編集)/i.test(b.textContent.trim())||b.classList.contains('pv-edit'));
        if(edits.length<=1)return;
        const keep=edits.find(b=>b.hasAttribute('data-edit'))||edits[0];
        edits.forEach(b=>{if(b===keep)return;const td=b.closest('td');b.remove();if(td&&!td.textContent.trim()&&!td.children.length){td.classList.add('pv-v5-empty-edit');td.remove();}});
      });
      document.querySelectorAll('.detail,.goal-card,.account-card').forEach(box=>{
        const edits=[...box.querySelectorAll('button')].filter(b=>/^\s*(Edit|संपादित|تعديل|编辑|Editar|Modifier|Bearbeiten|Изменить|編集)/i.test(b.textContent.trim())||b.classList.contains('pv-detail-edit')||b.classList.contains('pv-edit'));
        if(edits.length<=1)return;
        const keep=edits.find(b=>b.hasAttribute('data-edit'))||edits.find(b=>!b.classList.contains('pv-edit'))||edits[0];
        edits.forEach(b=>{if(b!==keep)b.remove()});
      });
    }

      document.querySelectorAll(selectors.join(',')).forEach(el=>{
        if(el.children.length&&!(el.matches('.btn,.settings-menu button,.nav-btn span:last-child,.utility-btn span:last-child'))) return;
        const txt=el.textContent.trim();
        const symbol=txt.match(/^[＋✓⇄↗▤◷◎◇◈▧⌂⚙?]\s*/)?.[0]||'';
        const core=symbol?txt.slice(symbol.length).trim():txt;
        if(dict[core]) el.textContent=symbol+dict[core];
        else if(dict[txt]) el.textContent=dict[txt];
      });
      const dyn=DYN[lang]||{};
      document.querySelectorAll('.stat-foot,.card-head .sub,.mini-row small,.metric-item small,.page-head p').forEach(el=>{
        let t=el.textContent;
        if(t==='After bills & budget'&&dyn.after)t=dyn.after;
        if(t==='Tracked expenses'&&dyn.tracked)t=dyn.tracked;
        if(t==='Salary + freelance + interest'&&dyn.salary)t=dyn.salary;
        if(t==='This month'&&dyn.thisMonth)t=dyn.thisMonth;
        if(t==='Last 6 months'&&dyn.last6)t=dyn.last6;
        t=t.replace(/^Across (\d+) accounts$/,(_,n)=>`${n} ${dyn.accounts||'accounts'}`)
           .replace(/^Across (\d+) goals$/,(_,n)=>`${n} ${dyn.goals||'goals'}`)

      if(search){search.placeholder={hi:'खाते, लेन-देन, बिल, दस्तावेज़ खोजें…',ar:'ابحث في الحسابات والمعاملات والفواتير والمستندات…',zh:'搜索账户、交易、账单、文档…',es:'Buscar cuentas, transacciones, facturas, documentos…',fr:'Rechercher comptes, transactions, factures, documents…',de:'Konten, Transaktionen, Rechnungen, Dokumente suchen…',pt:'Pesquisar contas, transações, contas, documentos…',ru:'Поиск счетов, операций, счетов к оплате, документов…',ja:'口座・取引・請求・書類を検索…'}[lang]||search.placeholder;}
      const monthSel=document.querySelector('.month-select:not(#currencySelect)');
      if(monthSel&&monthMap[lang]) [...monthSel.options].forEach(o=>{let t=o.textContent;Object.entries(monthMap[lang]).sort((a,b)=>b[0].length-a[0].length).forEach(([a,b])=>{t=t.replace(new RegExp('\\b'+a+'\\b','g'),b)});o.textContent=t});
      document.querySelectorAll('.pv-donut-label').forEach(el=>{if(dict[el.textContent.trim()])el.textContent=dict[el.textContent.trim()]});
    }

    let busy=false;
    function applyV5(){
      if(busy)return;busy=true;
      try{fixDashboardText();cleanDonuts();dedupeEdits();translateUI();}
      finally{busy=false}
    }

    const previousRender=render;
    render=function(){previousRender();requestAnimationFrame(applyV5)};
    const observer=new MutationObserver(()=>{if(!busy)requestAnimationFrame(applyV5)});
    observer.observe(document.querySelector('.workspace'),{childList:true,subtree:true});
    applyV5();
    return true;
  };

})();

  function loadDebts(){try{const x=JSON.parse(localStorage.getItem(STORAGE)||'null');if(Array.isArray(x)&&x.length)return x}catch(e){}localStorage.setItem(STORAGE,JSON.stringify(DEFAULT_DEBTS));return structuredClone(DEFAULT_DEBTS)}

  function num(v,d=0){v=Number(v);return Number.isFinite(v)?v:d}
  function clamp(v,min,max){return Math.min(max,Math.max(min,v))}
  function currency(){const c=(window.state?.settings?.currency||window.S?.settings?.currency||document.querySelector('select[data-currency]')?.value||'INR').toUpperCase();return ['INR','USD','EUR','GBP','AED','CNY','JPY','RUB','CAD','AUD','SGD','CHF'].includes(c)?c:'INR'}
  function money(v){const c=currency();try{return new Intl.NumberFormat(c==='INR'?'en-IN':'en-US',{style:'currency',currency:c,maximumFractionDigits:0}).format(num(v))}catch(e){return (c==='INR'?'₹':'')+Math.round(num(v)).toLocaleString('en-IN')}}
  function selected(){return debts.find(d=>d.id===state.selected)||debts[0]||null}
  function monthlyRate(apr){return Math.max(0,num(apr))/1200}
  function emi(principal,apr,months){principal=Math.max(0,num(principal));months=Math.max(1,Math.round(num(months,1)));const r=monthlyRate(apr);if(!r)return principal/months;const p=Math.pow(1+r,months);return principal*r*p/(p-1)}
  function amortize(balance,apr,payment,lump=0,maxMonths=1200){balance=Math.max(0,num(balance)-Math.max(0,num(lump)));payment=Math.max(0,num(payment));const r=monthlyRate(apr);let b=balance,interest=0,m=0;const pts=[balance];if(b<=0)return{months:0,interest:0,total:0,points:[0]};if(payment<=0||payment<=b*r)return{months:Infinity,interest:Infinity,total:Infinity,points:[balance]};while(b>.01&&m<maxMonths){const i=b*r;interest+=i;b=Math.max(0,b+i-payment);m++;if(m%3===0||b===0)pts.push(b)}return{months:m>=maxMonths?Infinity:m,interest,total:balance+interest,points:pts}}
  function risk(d){return d.apr>=24?['High','high']:d.apr>=12?['Watch','']:['Low','low']}
  function totalBalance(){return debts.reduce((s,d)=>s+num(d.balance),0)}

  function header(){const a=allPayoff();return `<div class="pv-debt-head"><div class="pv-debt-title"><h2>Debt Control Center</h2><p>Track every debt, simulate payoff changes, compare strategies and turn calculations into a plan.</p></div><div class="pv-debt-head-actions"><button class="pv-dbtn soft" data-dtab="simulator">Payoff Simulator</button><button class="pv-dbtn primary" data-debt-add>＋ Add Debt</button></div></div><div class="pv-debt-kpis"><div class="pv-dkpi"><span>Total Debt</span><b>${money(totalBalance())}</b><small>${debts.length} active account${debts.length===1?'':'s'}</small></div><div class="pv-dkpi"><span>Monthly Payments</span><b>${money(totalPayment())}</b><small>Current planned outflow</small></div><div class="pv-dkpi"><span>Weighted APR</span><b>${weightedApr().toFixed(1)}%</b><small>Across balances</small></div><div class="pv-dkpi"><span>Debt-Free Estimate</span><b>${monthsText(a.months)}</b><small>At current payments</small></div><div class="pv-dkpi"><span>Projected Interest</span><b>${Number.isFinite(a.interest)?money(a.interest):'—'}</b><small>Current plan estimate</small></div></div>`}
  function tabs(){return `<div class="pv-dtabs">${[['overview','Overview'],['simulator','Payoff Simulator'],['calculators','Calculators'],['strategies','Snowball vs Avalanche']].map(([k,l])=>`<button class="pv-dtab ${state.tab===k?'active':''}" data-dtab="${k}">${l}</button>`).join('')}</div>`}
  function overview(){const d=selected();if(!d)return `<div class="pv-dpane"><div class="pv-note">No debts yet. Use <b>Add Debt</b> to create your first debt record.</div></div>`;const pay=Math.max(num(d.payment),num(d.minPayment)),a=amortize(d.balance,d.apr,pay),[rt,rc]=risk(d),initial=DEFAULT_DEBTS.find(x=>x.name===d.name)?.balance||d.balance,progress=clamp((1-d.balance/Math.max(initial,d.balance))*100,0,100);return `<div class="pv-dpane"><div class="pv-dgrid2"><section class="pv-dcard"><h3>Your Debts</h3><div class="pv-debt-list">${debts.map(x=>{const [t,c]=risk(x);return `<div class="pv-debt-row ${x.id===d.id?'active':''}" data-debt-select="${x.id}"><div class="name"><b>${esc(x.name)}</b><small>${esc(x.type)}</small></div><div><small>Balance</small><div class="money">${money(x.balance)}</div></div><div class="rate"><small>APR</small><div>${num(x.apr).toFixed(1)}%</div></div><div><small>Payment</small><div class="money">${money(x.payment||x.minPayment)}</div></div><div class="pv-risk ${c}">${t}</div></div>`}).join('')}</div></section><aside class="pv-dcard"><div class="pv-selected"><div class="pv-sel-top"><div class="pv-sel-icon">◇</div><div class="pv-sel-name"><b>${esc(d.name)}</b><small>${esc(d.type)} · Due day ${d.dueDay||'—'}</small></div><button class="pv-dbtn" style="margin-left:auto" data-debt-edit="${d.id}">Edit</button></div><div><small style="color:var(--muted)">Remaining balance</small><div class="pv-big">${money(d.balance)}</div></div><div class="pv-mini-grid"><div class="pv-mini"><span>APR</span><b>${num(d.apr).toFixed(2)}%</b></div><div class="pv-mini"><span>Monthly payment</span><b>${money(pay)}</b></div><div class="pv-mini"><span>Est. payoff</span><b>${monthsText(a.months)}</b></div><div class="pv-mini"><span>Est. interest</span><b>${Number.isFinite(a.interest)?money(a.interest):'—'}</b></div></div><div><div style="display:flex;justify-content:space-between;font-size:8px;margin-bottom:3px"><span>Payoff progress</span><b>${Math.round(progress)}%</b></div><div class="pv-progress"><i style="width:${progress}%"></i></div></div><button class="pv-dbtn primary" data-dtab="simulator">Simulate faster payoff</button><div class="pv-note"><b>${rt==='High'?'High-interest priority':'Plan insight'}:</b> ${rt==='High'?'This debt has a high APR. Compare Avalanche to see the potential interest advantage.':'Try an extra monthly amount or one-time prepayment to measure the time and interest saved.'}</div></div></aside></div></div>`}
  function chartSvg(basePts,planPts){const W=720,H=230,pad=20,maxLen=Math.max(basePts.length,planPts.length,2),maxV=Math.max(...basePts,...planPts,1),path=pts=>pts.map((v,i)=>`${i?'L':'M'} ${(pad+i*(W-pad*2)/Math.max(1,maxLen-1)).toFixed(1)} ${(H-pad-v/maxV*(H-pad*2)).toFixed(1)}`).join(' '),pp=path(planPts);return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Debt balance payoff chart"><line class="pv-chart-grid" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/><line class="pv-chart-grid" x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}"/><path class="pv-chart-base" d="${path(basePts)}"/><path class="pv-chart-area" d="${pp} L ${W-pad} ${H-pad} L ${pad} ${H-pad} Z"/><path class="pv-chart-plan" d="${pp}"/></svg>`}
  function simulator(){const d=selected();if(!d)return `<div class="pv-dpane">Add a debt first.</div>`;const pay=Math.max(1,num(d.payment||d.minPayment)),base=amortize(d.balance,d.apr,pay),plan=amortize(d.balance,d.apr,pay+num(state.extra),num(state.lump)),savedM=Number.isFinite(base.months)&&Number.isFinite(plan.months)?Math.max(0,base.months-plan.months):0,savedI=Number.isFinite(base.interest)&&Number.isFinite(plan.interest)?Math.max(0,base.interest-plan.interest):0;return `<div class="pv-dpane"><div class="pv-sim"><section class="pv-dcard pv-controls"><h3>Payoff inputs</h3><div class="pv-field"><label>Debt</label><select data-sim-debt>${debts.map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="pv-field"><label>Current balance</label><input value="${money(d.balance)}" disabled></div><div class="pv-field"><label>APR</label><input value="${num(d.apr).toFixed(2)}%" disabled></div><div class="pv-field"><label>Current monthly payment</label><input value="${money(pay)}" disabled></div><div class="pv-field"><label>Extra every month</label><div class="pv-range"><input type="range" min="0" max="${Math.max(20000,Math.round(pay*2))}" step="500" value="${num(state.extra)}" data-extra-range><input type="number" min="0" step="500" value="${num(state.extra)}" data-extra></div></div><div class="pv-field"><label>One-time prepayment now</label><input type="number" min="0" step="1000" max="${d.balance}" value="${num(state.lump)}" data-lump></div><button class="pv-dbtn primary" data-apply-plan>Apply strategy to debt plan</button><div class="pv-note">Calculations run locally in your browser. Results are estimates based on a fixed APR and monthly payment.</div></section><section class="pv-sim-right"><div class="pv-result-grid"><div class="pv-result"><span>New monthly payment</span><b>${money(pay+num(state.extra))}</b></div><div class="pv-result"><span>New payoff</span><b>${monthsText(plan.months)}</b></div><div clas     .pvts-themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.pvts-theme{border:1px solid var(--pvx-border);background:var(--pvx-panel2);color:var(--pvx-text);border-radius:11px;padding:8px;text-align:left;cursor:pointer}.pvts-theme.active{outline:2px solid var(--pvx-brand);outline-offset:1px}.pvts-swatch{height:46px;border-radius:8px;overflow:hidden;display:grid;grid-template-columns:26% 1fr;border:1px solid #ffffff22}.pvts-swatch i{display:block}.pvts-swatch span{display:grid;grid-template-rows:1fr 1fr}.pvts-theme strong{display:block;margin-top:6px;font-size:9.5px}.pvts-theme small{font-size:7.5px;color:var(--pvx-muted)}
    .pvts-fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.pvts-font{min-height:58px;border:1px solid var(--pvx-border);background:var(--pvx-panel2);color:var(--pvx-text);border-radius:10px;padding:8px;text-align:left;cursor:pointer}.pvts-font.active{outline:2px solid var(--pvx-brand);outline-offset:1px}.pvts-font b{display:block;font-size:10px}.pvts-font em{display:block;margin-top:5px;font-size:16px;font-style:normal}.pvts-density{display:flex;gap:6px;flex-wrap:wrap}.pvts-density button{height:31px;border:1px solid var(--pvx-border);background:var(--pvx-panel2);color:var(--pvx-text);border-radius:9px;padding:0 11px;font-size:9px;font-weight:700;cursor:pointer}.pvts-density button.active{background:var(--pvx-brand);color:#fff;border-color:transparent}
    .pvts-foot{display:flex;align-items:center;gap:8px;margin-top:15px;padding-top:10px;border-top:1px solid var(--pvx-border)}.pvts-foot small{color:var(--pvx-muted);font-size:8px}.pvts-reset{margin-left:auto;height:31px;border:1px solid var(--pvx-border);background:transparent;color:var(--pvx-text);border-radius:9px;padding:0 10px;font-size:9px;cursor:pointer}
    @media(max-width:680px){.pvts-themes{grid-template-columns:repeat(2,minmax(0,1fr))}.pvts-fonts{grid-template-columns:1fr}}
  `;
  document.head.appendChild(css);

  function load(){try{return Object.assign({theme:'sage',font:'classic',density:'comfortable'},JSON.parse(localStorage.getItem(KEY)||'{}')||{})}catch(e){return{theme:'sage',font:'classic',density:'comfortable'}}}
  function save(){localStorage.setItem(KEY,JSON.stringify(prefs))}
  function setVar(el,k,v){el.style.setProperty(k,v,'important')}
  function apply(){
    if(applying)return;applying=true;
    const t=THEMES[prefs.theme]||THEMES.sage,f=FONTS[prefs.font]||FONTS.classic,d=DENSITY[prefs.density]||DENSITY.comfortable;
    const root=document.documentElement,body=document.body;
    root.dataset.pvTheme=prefs.theme;root.dataset.pvDensity=prefs.density;root.dataset.pvFont=prefs.font;
    const vars={
      '--pvx-bg':t.bg,'--pvx-panel':t.panel,'--pvx-panel2':t.panel2,'--pvx-text':t.text,'--pvx-muted':t.muted,'--pvx-border':t.border,'--pvx-brand':t.brand,'--pvx-brand2':t.brand2,'--pvx-sidebar':t.sidebar,'--pvx-sideText':t.sideText,'--pvx-input':t.input,'--pvx-danger':t.danger,'--pvx-success':t.success,'--pvx-body-font':f.body,'--pvx-heading-font':f.head,'--pvx-scale':String(d.scale),'--pvx-space':String(d.space),
      '--bg':t.bg,'--background':t.bg,'--panel':t.panel,'--panel2':t.panel2,'--surface':t.panel,'--surface2':t.panel2,'--text':t.text,'--muted':t.muted,'--border':t.border,'--brand':t.brand,'--brand2':t.brand2,'--accent':t.brand,'--sidebar':t.sidebar,'--sideText':t.sideText,'--danger':t.danger,'--success':t.success
    };
    [root,body].filter(Boolean).forEach(el=>Object.entries(vars).forEach(([k,v])=>setVar(el,k,v)));
    if(body){body.classList.toggle('light',t.kind==='light');body.classList.toggle('pv-custom-dark',t.kind==='dark')}
    try{const s=JSON.parse(localStorage.getItem('pv-fin-live')||'null');if(s&&s.s){s.s.theme=t.kind==='light'?'light':'dark';localStorage.setItem('pv-fin-live',JSON.stringify(s))}}catch(e){}
    setTimeout(()=>{applying=false},0);
  }

  function ensureButton(){
    if(document.getElementById('pvThemeStudioBtn'))return;
    const top=document.querySelector('.topbar');if(!top)return;
    const b=document.createElement('button');b.id='pvThemeStudioBtn';b.type='button';b.title='Theme Studio';b.setAttribute('aria-label','Open Theme Studio');b.textContent='◐';b.onclick=openStudio;
    const tx=[...top.querySelectorAll('button')].find(x=>/new transaction/i.test(x.textContent||''));
    if(tx)top.insertBefore(b,tx);else top.appendChild(b);
  }

  function openStudio(){
    document.querySelector('.pvts-shade')?.remove();
    const shade=document.createElement('div');shade.className='pvts-shade';
    shade.innerHTML=`<div class="pvts-panel" role="dialog" aria-modal="true"><div class="pvts-head"><div><h2>Theme Studio</h2><p>Customize Finance without changing your data. Preferences stay on this device.</p></div><button class="pvts-close" data-close>×</button></div>
      <section class="pvts-section"><div class="pvts-label"><b>Interface theme</b><span>6 palettes</span></div><div class="pvts-themes">${Object.entries(THEMES).map(([id,t])=>`<button class="pvts-theme ${prefs.theme===id?'active':''}" data-theme="${id}"><div class="pvts-swatch"><i style="background:${t.sidebar}"></i><span><i style="background:${t.bg}"></i><i style="background:${t.panel}"></i></span></div><strong>${t.name}</strong><small>${t.kind==='dark'?'Dark':'Light'} workspace</small></button>`).join('')}</div></section>
      <section class="pvts-section"><div class="pvts-label"><b>Text style</b><span>System fonts · no downloads</span></div><div class="pvts-fonts">${Object.entries(FONTS).map(([id,f])=>`<button class="pvts-font ${prefs.font===id?'active':''}" data-font="${id}"><b>${f.name}</b><em style="font-family:${f.head}">${f.sample}</em></button>`).join('')}</div></section>
      <section class="pvts-section"><div class="pvts-label"><b>Interface density</b><span>Useful for laptops vs large displays</span></div><div class="pvts-density">${Object.entries(DENSITY).map(([id,d])=>`<button class="${prefs.density===id?'active':''}" data-density="${id}">${d.name}</button>`).join('')}</div></section>
      <div class="pvts-foot"><small>Theme changes apply immediately across Dashboard, Debt, calculators, tables and dialogs.</small><button class="pvts-reset" data-reset>Reset defaults</button></div></div>`;
    document.body.appendChild(shade);
    const rerender=()=>{apply();save();shade.remove();openStudio()};
    shade.querySelector('[data-close]').onclick=()=>shade.remove();shade.addEventListener('click',e=>{if(e.target===shade)shade.remove()});
    shade.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{prefs.theme=b.dataset.theme;rerender()});
    shade.querySelectorAll('[data-font]').forEach(b=>b.onclick=()=>{prefs.font=b.dataset.font;rerender()});
    shade.querySelectorAll('[data-density]').forEach(b=>b.onclick=()=>{prefs.density=b.dataset.density;rerender()});
    shade.querySelector('[data-reset]').onclick=()=>{prefs={theme:'sage',font:'classic',density:'comfortable'};rerender()};
  }

  function maybeSettingsHint(){
    const active=[...document.querySelectorAll('.nav-btn.active,.nav.active,[data-nav].active,[data-v].active')].find(x=>/settings/i.test((x.dataset.nav||x.dataset.v||x.textContent||'')));
    if(!active)return;
    const host=document.querySelector('.workspace')||document.querySelector('.content');if(!host||host.querySelector('.pvts-settings-card'))return;
    const card=document.createElement('div');card.className='pvts-settings-card';
    card.style.cssText='position:absolute;right:18px;bottom:16px;z-index:40;background:var(--pvx-panel);color:var(--pvx-text);border:1px solid var(--pvx-border);border-radius:11px;padding:8px 10px;box-shadow:0 8px 24px #0001;font-size:9px;display:flex;align-items:center;gap:8px';
    card.innerHTML='<b>Theme Studio</b><span style="color:var(--pvx-muted)">Theme · text · density</span><button type="button" style="height:28px;border:0;border-radius:8px;background:var(--pvx-brand);color:#fff;padding:0 9px;cursor:pointer;font-weight:700">Customize</button>';
    card.querySelector('button').onclick=openStudio;host.style.position='relative';host.appendChild(card);
  }

  apply();
  const obs=new MutationObserver(()=>{ensureButton();maybeSettingsHint();if(!applying)apply()});
  obs.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style']});
  setTimeout(()=>{ensureButton();maybeSettingsHint();apply()},120);
})();
}finally{if(__pvMO)window.MutationObserver=__pvMO;}})();

</script>

<script data-pawanro-bundled="bell-contrast-r1">
(()=>{
  if(window.__PAVENRO_BELL_CONTRAST_R1__) return;
  window.__PAVENRO_BELL_CONTRAST_R1__=true;

  const style=document.createElement('style');
  style.id='pavenro-bell-contrast-r1-style';
  style.textContent=`
    html[data-pv-theme] .pv-notification-fix{
      position:relative!important;
      display:grid!important;
      place-items:center!important;
      width:40px!important;
      min-width:40px!important;
      height:40px!important;
      padding:0!important;
      border:1px solid var(--pvx-border,#d8e3da)!important;
      border-radius:10px!important;
      background:var(--pvx-panel2,#edf3ee)!important;
      color:var(--pvx-text,#17301f)!important;
      opacity:1!important;
      box-shadow:none!important;
    }
    html[data-pv-theme] .pv-notification-fix:hover{
      border-color:var(--pvx-brand,#21653f)!important;
      background:var(--pvx-input,var(--pvx-panel2,#edf3ee))!important;
    }
    html[data-pv-theme] .pv-notification-fix svg{
      width:18px!important;
      height:18px!important;
      display:block!important;
      color:inherit!important;
      opacity:1!important;
      visibility:visible!important;
      stroke:currentColor!important;
      fill:none!important;
    }
    html[data-pv-theme] .pv-notification-fix svg path,
    html[data-pv-theme] .pv-notification-fix svg line,
    html[data-pv-theme] .pv-notification-fix svg polyline,
    html[data-pv-theme] .pv-notification-fix svg circle{
      stroke:currentColor!important;
      opacity:1!important;
    }
    html[data-pv-theme] .pv-notification-fix i,
    html[data-pv-theme] .pv-notification-fix .icon,
    html[data-pv-theme] .pv-notification-fix [class*="bell"]{
      color:inherit!important;
      opacity:1!important;
      visibility:visible!important;
    }
    html[data-pv-theme="midnight"] .pv-notification-fix,
    html[data-pv-theme="graphite"] .pv-notification-fix{
      color:#f5fbf8!important;
      background:var(--pvx-panel2)!important;
      border-color:color-mix(in srgb,var(--pvx-text) 30%,var(--pvx-border))!important;
    }
    html[data-pv-theme] .pv-notification-fix::after{
      border-color:var(--pvx-panel,var(--pvx-bg))!important;
    }
    html[data-pv-theme] .pv-notification-fix [class*="dot"],
    html[data-pv-theme] .pv-notification-fix [class*="badge"],
    html[data-pv-theme] .pv-notification-fix [class*="count"]{
      opacity:1!important;
    }
  `;
  document.head.appendChild(style);

  function text(el){return (el?.textContent||'').replace(/\s+/g,' ').trim().toLowerCase()}
  function descriptor(el){return [el?.id,el?.className,el?.getAttribute?.('aria-label'),el?.getAttribute?.('title'),el?.getAttribute?.('data-action'),el?.getAttribute?.('data-testid')].filter(Boolean).join(' ').toLowerCase()}
  function likelyBell(btn){
    const d=descriptor(btn),html=(btn?.innerHTML||'').toLowerCase();
    return /notif|notification|bell|alert/.test(d)||/bell|notification/.test(html)||text(btn)==='🔔';
  }
  function mark(){
    const bar=document.querySelector('.topbar');
    if(!bar)return;
    const buttons=[...bar.querySelectorAll('button')];
    let bell=buttons.find(likelyBell);
    if(!bell){
      const tx=buttons.find(b=>/new transaction|transaction/.test(text(b)));
      if(tx){
        const i=buttons.indexOf(tx);
        bell=buttons.slice(i+1).find(b=>{
          const t=text(b),r=b.getBoundingClientRect();
          return !t||t.length<=2 ? r.width<=55&&r.height<=55 : false;
        });
      }
    }
    if(!bell)return;
    bell.classList.add('pv-notification-fix');
    if(!bell.getAttribute('aria-label'))bell.setAttribute('aria-label','Notifications');
    if(!bell.getAttribute('title'))bell.setAttribute('title','Notifications');
  }

  let queued=false;
  const schedule=()=>{
    if(queued)return;
    queued=true;
    requestAnimationFrame(()=>{queued=false;mark()});
  };
  mark();
  const mo=new MutationObserver(schedule);
  mo.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class','data-pv-theme','style']});
  document.addEventListener('click',schedule,true);
  window.addEventListener('resize',schedule);
})();

//# sourceURL=pawanro-offline-bell-contrast-r1.js
</script>
