<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>TULSHII Finance</title>
  <style>
    html,body{margin:0;height:100%;background:#f5f6f1;font-family:Inter,system-ui;color:#17301f}
    .load{height:100%;display:grid;place-items:center}.box{text-align:center}
    .spinner{width:42px;height:42px;border:4px solid #dce8df;border-top-color:#28623f;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="load"><div class="box"><div class="spinner"></div><b>Loading TULSHII Finance...</b><div style="margin-top:7px;color:#6d7a70;font-size:13px">Preparing your workspace</div></div></div>
  <script>
  (async()=>{
    const BASE='https://cdn.jsdelivr.net/gh/pawansiddh/Tulshii-Finance@main/';
    try{
      const parts=[];
      for(let i=0;i<10;i++) parts.push(fetch(BASE+`data/${i}.txt?v=finance-live-20260830`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('payload '+i+' '+r.status);return r.text()}));
      const packed=(await Promise.all(parts)).join('').trim();
      const bytes=Uint8Array.from(atob(packed),c=>c.charCodeAt(0));
      const ds=new DecompressionStream('gzip');
      const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
      const base='<base href="'+BASE+'">';
      const guard='<style id="pvDemo2BootMask">html.pv-demo2-booting body{opacity:0!important;pointer-events:none!important}html.pv-demo2-booting::before{content:"Loading TULSHII Finance...\\A Preparing your workspace";white-space:pre;position:fixed;inset:0;z-index:2147483646;display:grid;place-items:center;text-align:center;background:#f5f6f1;color:#17301f;font:600 15px/1.8 Inter,system-ui;letter-spacing:.01em}html.pv-demo2-booting::after{content:"";position:fixed;left:50%;top:calc(50% - 48px);z-index:2147483647;width:36px;height:36px;margin:-18px 0 0 -18px;border:4px solid #dce8df;border-top-color:#28623f;border-radius:50%;animation:pvDemo2Spin .8s linear infinite}@keyframes pvDemo2Spin{to{transform:rotate(360deg)}}</style><script>document.documentElement.classList.add("pv-demo2-booting")</scr'+'ipt>';
      const loader='<script src="'+BASE+'patch-loader-fast-r3.js?v=tulshii-finance-live-20260830"></scr'+'ipt>';
      const patched=html.replace(/<head([^>]*)>/i,m=>m+base+guard).replace('</body>',loader+'</body>');
      document.open();document.write(patched);document.close();
    }catch(e){
      document.body.innerHTML='<div style="padding:40px;font:16px system-ui"><h2>TULSHII Finance could not load.</h2><p>Your local finance data has not been changed. Refresh the page to retry.</p><pre style="white-space:pre-wrap">'+String(e)+'</pre></div>';
    }
  })();
  </script>
</body>
</html>
