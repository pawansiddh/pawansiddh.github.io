name: Build PAWANRO Finance Lifetime Offline

on:
  workflow_dispatch:
  push:
    paths:
      - 'finance-demo2/**'
      - '.github/workflows/build-finance-offline.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax-check Finance runtime
        run: |
          set -e
          node --check finance-demo2/patch-loader-fast-r1.js
          node --check finance-demo2/finance-state-bridge-r1.js
          node --check finance-demo2/finance-phase1-r3.js
          node --check finance-demo2/finance-phase1-core2-r1.js
          node --check finance-demo2/finance-phase1-planning-r1.js
          node --check finance-demo2/finance-phase1-records-r1.js
          node --check finance-demo2/finance-phase1-status-fix-r1.js
          node --check finance-demo2/finance-interaction-audit-r1.js
          node --check finance-demo2/finance-daily-briefing-r2.js
          node --check finance-demo2/finance-calendar-studio-r1.js
          node --check finance-demo2/finance-coedit-audit-r1.js
          node --check finance-demo2/finance-offline-sync-r1.js
          node --check finance-demo2/finance-phase2-r1.js
          node --check finance-demo2/finance-brand-sidebar-r1.js
          node --check finance-demo2/finance-ui-controls-r2.js
          node --check finance-demo2/finance-sidebar-shell-r2.js
          node --check finance-demo2/sw.js
          python3 -m py_compile finance-demo2/tools/build-offline.py

      - name: Browser smoke-test Demo 2
        run: |
          set -e
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          cat > finance-demo2-smoke.html <<'EOF'
          <!doctype html><html data-result="running"><body><iframe id="app" src="/finance-demo2/?ci-smoke=1" style="width:1200px;height:800px"></iframe><pre id="out">running</pre><script>
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const waitFor=async(fn,ms=20000)=>{const end=Date.now()+ms;while(Date.now()<end){try{const v=fn();if(v)return v}catch(_){}await sleep(100)}throw new Error('Timed out waiting for Demo 2 runtime')};
          const diag=frame=>{try{const w=frame.contentWindow,d=frame.contentDocument,h=d?.documentElement;return JSON.stringify({href:w?.location?.href||'',readyState:d?.readyState||'',health:h?.dataset?.pvRuntimeHealth||'',ui:h?.dataset?.pvUiControls||'',shell:h?.dataset?.pvSidebarShell||'',booting:!!h?.classList?.contains('pv-demo2-booting'),body:(d?.body?.innerText||'').slice(0,1600),scripts:[...(d?.querySelectorAll?.('script')||[])].map(s=>s.src||'[inline]').slice(-10),report:w?.__PV_BOOT_REPORT__||null},null,2)}catch(x){return 'diagnostic failed: '+x}};
          (async()=>{const root=document.documentElement,out=document.getElementById('out'),frame=document.getElementById('app');try{
            const w=await waitFor(()=>frame.contentWindow&&frame.contentDocument?.documentElement?.dataset?.pvRuntimeHealth?frame.contentWindow:null,22000),d=w.document,h=d.documentElement;
            await waitFor(()=>h.dataset.pvRuntimeHealth==='ok',10000);
            const r=w.__PV_BOOT_REPORT__;
            if(!r||!Number.isFinite(r.totalMs))throw new Error('Missing boot diagnostics');
            if(r.totalMs>5000)throw new Error('Local consolidated boot exceeded 5 seconds: '+r.totalMs+'ms');
            if(h.dataset.pvUiControls!=='r2')throw new Error('Superseded UI controls are active: '+h.dataset.pvUiControls);
            if(h.dataset.pvSidebarShell!=='r2')throw new Error('Final sidebar shell R2 is not active');
            if(h.classList.contains('pv-demo2-booting'))throw new Error('Boot mask remained active');
            if(!d.querySelector('.topbar'))throw new Error('Topbar missing');
            const side=d.querySelector('.sidebar,#pvSide');if(!side)throw new Error('Sidebar missing');
            const wordmark=await waitFor(()=>d.getElementById('pvPawanroWordmark'),3000);
            if((wordmark.alt||'').toUpperCase()!=='PAWANRO')throw new Error('PAWANRO wordmark not active');
            const product=await waitFor(()=>d.querySelector('.sidebar .brand .pv-brand-finance'),2000);
            if((product.textContent||'').replace(/\s+/g,' ').trim().toUpperCase()!=='| FINANCE')throw new Error('Expanded header is not PAWANRO | FINANCE');
            if(getComputedStyle(product).display==='none')throw new Error('FINANCE product label missing in expanded sidebar');
            const dup=[...d.querySelectorAll('#pvSide .pv-brand-render,#pvSide [data-pv-brand-slot="1"]')].filter(x=>getComputedStyle(x).display!=='none');
            if(dup.length)throw new Error('Duplicate sidebar brand is still visible');
            const visibleSideText=[...side.querySelectorAll('*')].filter(x=>getComputedStyle(x).display!=='none'&&getComputedStyle(x).visibility!=='hidden').map(x=>(x.textContent||'').replace(/\s+/g,' ').trim().toUpperCase());
            if(visibleSideText.includes('PAWANRO FINANCE')||visibleSideText.includes('PAVENRO FINANCE'))throw new Error('Duplicate PAWANRO FINANCE section label is visible');
            const brand=d.querySelector('.sidebar .brand');if(!brand)throw new Error('Sidebar brand container missing');
            if(getComputedStyle(brand,'::before').display!=='none'||getComputedStyle(brand,'::after').display!=='none')throw new Error('Brand decorative line is still visible');
            const help=[...side.querySelectorAll('button')].find(x=>/help\s*&?\s*support/i.test(`${x.dataset.v||''} ${x.title||''} ${x.getAttribute('aria-label')||''} ${x.textContent||''}`));
            if(help&&!/help\s*&?\s*support/i.test(help.textContent||''))throw new Error('Help & Support label missing in expanded sidebar');
            d.body.classList.add('pv-rail');w.PawanroSidebarShell?.refresh?.();await sleep(80);
            const mini=d.querySelector('.sidebar .pv-pawanro-mini');if(!mini||getComputedStyle(mini).display==='none')throw new Error('Collapsed PAWANRO icon is not visible');
            if(getComputedStyle(wordmark).display!=='none')throw new Error('Expanded wordmark remains visible in collapsed sidebar');
            if(getComputedStyle(product).display!=='none')throw new Error('| FINANCE remains visible in collapsed sidebar');
            if(help&&help.querySelector('.pv-util-label')&&getComputedStyle(help.querySelector('.pv-util-label')).display!=='none')throw new Error('Help label remains visible in collapsed sidebar');
            d.body.classList.remove('pv-rail');w.PawanroSidebarShell?.refresh?.();await sleep(60);
            if(getComputedStyle(wordmark).display==='none'||getComputedStyle(product).display==='none')throw new Error('PAWANRO | FINANCE did not restore after expanding sidebar');
            const year=d.getElementById('pvPeriodYear');
            if(!year)throw new Error('Finance year selector missing');
            const nowYear=new Date().getFullYear(),future=[...year.options].map(o=>Number(o.value)).filter(y=>y>nowYear);
            if(future.length)throw new Error('Future Finance years are selectable: '+future.join(','));
            const audit=d.getElementById('pvAuditBtn');if(!audit)throw new Error('Change history control missing');
            audit.click();await waitFor(()=>d.querySelector('.pv-ca-shade'),2500);d.querySelector('.pv-ca-close')?.click();await sleep(80);
            if(d.querySelector('.pv-ca-shade'))throw new Error('Change history panel did not close');
            if(d.querySelector('.pv-pl-panel[data-k="calendar"]'))throw new Error('Superseded planning Calendar is still mounted');
            const navs=[...d.querySelectorAll('#pvSide .nav-btn,.sidebar .nav-btn,[data-nav]')];
            const wanted=['Dashboard','Accounts','Transactions','Bills','Budget','Income','Funds & Goals','Documents','Calendar','Subscriptions','Debt','Net Worth','Investments','Reports','Notes','Tax Records','Paydays','Settings','Help & Support'];
            const tested=[];
            for(const name of wanted){const b=navs.find(x=>(x.textContent||'').replace(/\s+/g,' ').trim().toLowerCase().includes(name.toLowerCase()));if(!b)continue;b.click();await sleep(420);tested.push(name);
              const bad=[...d.querySelectorAll('tr')].find(tr=>tr.querySelectorAll('select[data-pv-role="bill-status"],select[data-pv-role="bill-detail-status"],select[data-pv-role="tx-status"]').length>1);if(bad)throw new Error('Duplicate status controls after '+name);
              const actions=d.querySelectorAll('.pv-p1-action,.pv-c2-action,.pv-pl-action,.pv-r-action,.pv-ia-top');if(actions.length>2)throw new Error('Competing page actions after '+name+': '+actions.length);
              if(name==='Calendar'){await sleep(450);const labels=[...d.querySelectorAll('button')].map(x=>(x.textContent||'').trim().toLowerCase());for(const x of ['month','week','day','year'])if(!labels.includes(x))throw new Error('Calendar '+x+' view missing')}
              if(name==='Subscriptions'&&!d.querySelector('.pv-pl-action'))throw new Error('Subscription add action missing');
              if(name==='Net Worth'&&!d.querySelector('.pv-pl-action'))throw new Error('Net Worth add asset action missing');
              if(name==='Investments'&&!d.querySelector('.pv-pl-action'))throw new Error('Investment add action missing');
              if(name==='Reports'&&!d.querySelector('.pv-r-action'))throw new Error('Report action missing');
              if(name==='Notes'&&!d.querySelector('.pv-r-action'))throw new Error('Notes add action missing');
              if(name==='Tax Records'&&!d.querySelector('.pv-r-action'))throw new Error('Tax add action missing');
              if(name==='Paydays'&&!d.querySelector('.pv-r-action'))throw new Error('Payday add action missing');
            }
            if(tested.length<8)throw new Error('Too few Finance sections were testable: '+tested.join(', '));
            root.dataset.result='pass';root.dataset.bootMs=String(r.totalMs);out.textContent=JSON.stringify({bootMs:r.totalMs,health:r.health,ui:h.dataset.pvUiControls,shell:h.dataset.pvSidebarShell,yearOptions:[...year.options].map(o=>o.value),brand:wordmark.alt,product:(product.textContent||'').replace(/\s+/g,' ').trim(),auditOpened:true,sidebarClean:true,policies:r.policies,tested},null,2);
          }catch(e){root.dataset.result='fail';out.textContent=String(e&&e.stack||e)+'\n\n'+diag(frame)}})();
          </script></body></html>
          EOF
          python3 -m http.server 8765 >/tmp/pawanro-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=32000 --dump-dom http://127.0.0.1:8765/finance-demo2-smoke.html > /tmp/pawanro-smoke-dom.html
          cat /tmp/pawanro-smoke-dom.html
          echo '--- HTTP LOG ---'
          cat /tmp/pawanro-http.log || true
          grep -q 'data-result="pass"' /tmp/pawanro-smoke-dom.html
          ! grep -q 'data-result="fail"' /tmp/pawanro-smoke-dom.html

      - name: Build exact standalone HTML
        run: python3 finance-demo2/tools/build-offline.py

      - name: Verify standalone artifact
        run: |
          set -e
          FILE=finance-demo2/offline-build/PAWANRO_Finance_Lifetime_Offline_EXACT.html
          test -s "$FILE"
          echo "Size: $(wc -c < "$FILE") bytes"
          ! grep -q 'src="patch-loader.js' "$FILE"
          ! grep -q 'src="patch-loader-fast-r1.js' "$FILE"
          ! grep -q 'data/0.txt' "$FILE"
          ! grep -q 'finance-phase1-r1.js' "$FILE"
          ! grep -q 'finance-phase1-r2.js' "$FILE"
          ! grep -q 'finance-daily-briefing-r1.js' "$FILE"
          ! grep -q '"ui-controls-r1"' "$FILE"
          grep -q 'pawanro-offline-debt-lab-r1.js' "$FILE"
          grep -q '"daily-briefing-r2"' "$FILE"
          grep -q '"calendar-studio-r1"' "$FILE"
          grep -q '"coedit-audit-r1"' "$FILE"
          grep -q '"phase2-r1"' "$FILE"
          grep -q '"brand-sidebar-r1"' "$FILE"
          grep -q '"ui-controls-r2"' "$FILE"
          grep -q '"sidebar-shell-r2"' "$FILE"
          grep -q 'name="pavenro-edition"' "$FILE"
          grep -q 'PAWANRO Finance Lifetime Offline' "$FILE"

      - name: Upload Lifetime HTML
        uses: actions/upload-artifact@v4
        with:
          name: PAWANRO-Finance-Lifetime-Offline-EXACT
          path: finance-demo2/offline-build/PAWANRO_Finance_Lifetime_Offline_EXACT.html
          if-no-files-found: error
          retention-days: 7