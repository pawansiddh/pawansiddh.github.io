<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAVENRO Focus · Finance Demo</title><style>html,body{margin:0;height:100%;background:#f7f7f2;font-family:Inter,system-ui;color:#17301f}.load{height:100%;display:grid;place-items:center}.box{text-align:center}.spinner{width:42px;height:42px;border:4px solid #dce8df;border-top-color:#28623f;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="load"><div class="box"><div class="spinner"></div><b>Loading PAVENRO Finance...</b><div style="margin-top:7px;color:#6d7a70;font-size:13px">Full interactive demo data</div></div></div><script>(async()=>{try{const ps=[];for(let i=0;i<6;i++)ps.push(fetch(`data/${i}.txt?v=full-finance-1`).then(r=>{if(!r.ok)throw Error('payload '+i);return r.text()}));const x=(await Promise.all(ps)).join('').trim();const b=Uint8Array.from(atob(x),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="padding:40px;font:16px system-ui"><h2>PAVENRO Finance demo could not load.</h2><p>Please hard-refresh once after GitHub Pages finishes publishing the new files.</p><pre>'+e+'</pre></div>'}})();</script></body></html>
